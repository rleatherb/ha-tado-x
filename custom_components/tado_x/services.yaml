# Services for Tado X integration

set_temperature_offset:
  name: Set temperature offset
  description: Adjust the temperature offset for a Tado X device (valve or sensor). This calibrates the device's temperature reading.
  fields:
    device_id:
      name: Device
      description: The Tado X device to calibrate
      required: true
      selector:
        device:
          integration: tado_x
    offset:
      name: Temperature offset
      description: Temperature offset in °C. Positive values make the device read higher, negative values make it read lower.
      required: true
      example: -2.0
      selector:
        number:
          min: -9.9
          max: 9.9
          step: 0.1
          unit_of_measurement: "°C"

add_meter_reading:
  name: Add meter reading
  description: Upload a meter reading to Tado Energy IQ
  fields:
    device_id:
      name: Tado X Home device
      description: Optional when only one Tado X home is configured; select the Tado X Home device when multiple homes are configured (not a room or thermostat).
      required: false
      selector:
        device:
          integration: tado_x
    reading:
      name: Reading
      description: Meter reading value (integer)
      required: true
      example: 12345
      selector:
        number:
          min: 0
          max: 999999999
          mode: box
    date:
      name: Date
      description: Date of reading (YYYY-MM-DD format, defaults to today)
      required: false
      example: "2026-01-14"
      selector:
        text:

set_eiq_tariff:
  name: Set energy tariff
  description: Set an energy tariff in Tado Energy IQ for cost calculations
  fields:
    device_id:
      name: Tado X Home device
      description: Optional when only one Tado X home is configured; select the Tado X Home device when multiple homes are configured (not a room or thermostat).
      required: false
      selector:
        device:
          integration: tado_x
    tariff:
      name: Tariff
      description: Price per unit (e.g., 0.85 for €0.85/m³)
      required: true
      example: 0.85
      selector:
        number:
          min: 0
          max: 100
          step: 0.01
          mode: box
    unit:
      name: Unit
      description: Energy unit type
      required: true
      example: "m3"
      selector:
        select:
          options:
            - label: "Cubic meters (m³)"
              value: "m3"
            - label: "Kilowatt hours (kWh)"
              value: "kWh"
    start_date:
      name: Start date
      description: Start date for the tariff (YYYY-MM-DD format, defaults to today)
      required: false
      example: "2026-01-01"
      selector:
        text:
    end_date:
      name: End date
      description: End date for the tariff (YYYY-MM-DD format, leave empty for ongoing tariff)
      required: false
      example: "2026-12-31"
      selector:
        text:

set_climate_timer:
  name: Set climate timer
  description: Set a room temperature override. Timer (default) requires temperature and duration; Manual requires temperature only; Next time block requires temperature but not duration.
  fields:
    entity_id:
      name: Climate entity
      description: The Tado X climate entity (room) to control
      required: true
      example: "climate.living_room"
      selector:
        entity:
          integration: tado_x
          domain: climate
    temperature:
      name: Temperature
      description: Required for Timer, Manual and Next time block.
      required: false
      example: 22.0
      selector:
        number:
          min: 5.0
          max: 30.0
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      name: Duration
      description: Required only for Timer (1-1440 minutes); ignored for Manual and Next time block.
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: "min"
    termination_type:
      name: Termination type
      description: Timer (default if omitted) requires temperature and duration; Manual requires temperature only; Next time block requires temperature only.
      required: false
      default: "TIMER"
      example: "TIMER"
      selector:
        select:
          options:
            - label: "Timer"
              value: "TIMER"
            - label: "Manual"
              value: "MANUAL"
            - label: "Next time block"
              value: "NEXT_TIME_BLOCK"

get_schedule:
  name: Get schedule
  description: Read the current smart heating schedule for a room. Returns the schedule blocks as a response.
  fields:
    entity_id:
      name: Climate entity
      description: The Tado X room to query or control
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate

get_away_schedule:
  name: Get away schedule
  description: Read the stored per-room Away mode, temperature and preheating configuration. Returns the settings as a response without changing them.
  fields:
    entity_id:
      name: Climate entity
      description: The Tado X room whose Away settings should be returned
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate

set_away_schedule:
  name: Set away schedule
  description: Update a room's Tado X Away mode, temperature and optional preheating level. Existing saved schedule profiles are not modified. When enabling Away from OFF, specify a temperature.
  fields:
    entity_id:
      name: Climate entity
      description: The Tado X room whose Away configuration should be updated
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate
    mode:
      name: Away mode
      description: Enable or disable Away temperature control
      required: true
      selector:
        select:
          options:
            - label: "On"
              value: "ON"
            - label: "Off"
              value: "OFF"
    away_temperature:
      name: Away temperature
      description: Temperature in °C when Away mode is ON. If omitted, the current Away temperature is retained when available. Ignored for OFF.
      required: false
      selector:
        number:
          min: 0.1
          max: 49.9
          step: 0.5
          mode: box
          unit_of_measurement: °C
    preheating_level:
      name: Preheating level
      description: Optional Tado X preheating setting; if omitted, the current setting is preserved.
      required: false
      selector:
        select:
          options:
            - "OFF"
            - "ECO"
            - "BALANCE"
            - "COMFORT"

set_schedule:
  name: Set schedule
  description: Modify the smart heating schedule for a room. Replaces the blocks for the given day type.
  fields:
    entity_id:
      name: Climate entity
      description: The Tado X room to query or control
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate
    day_type:
      name: Day type
      description: Which day(s) this schedule applies to.
      required: true
      example: "MONDAY_TO_SUNDAY"
      selector:
        select:
          options:
            - label: "Every day"
              value: "MONDAY_TO_SUNDAY"
            - label: "Weekdays"
              value: "MONDAY_TO_FRIDAY"
            - label: "Monday"
              value: "MONDAY"
            - label: "Tuesday"
              value: "TUESDAY"
            - label: "Wednesday"
              value: "WEDNESDAY"
            - label: "Thursday"
              value: "THURSDAY"
            - label: "Friday"
              value: "FRIDAY"
            - label: "Saturday"
              value: "SATURDAY"
            - label: "Sunday"
              value: "SUNDAY"
    schedule:
      name: Schedule blocks
      description: >-
        JSON array of schedule blocks. Each block: {"dayType": "MONDAY",
        "start": "07:00", "end": "09:00", "setting": {"power": "ON",
        "temperature": {"value": 21.0}}}. "power" is ON or OFF; "temperature"
        may be null when power is OFF.
      required: true
      example: '[{"dayType":"MONDAY","start":"07:00","end":"09:00","setting":{"power":"ON","temperature":{"value":21.0}}}]'
      selector:
        text:
          multiline: true

get_day_report:
  name: Get day report
  description: Read historical temperature, humidity and heating data for a room and date. Returns the report and a summary as a response. Today's data works on all tiers; past days require an Auto-Assist (Premium) subscription.
  fields:
    entity_id:
      name: Climate entity
      description: The Tado X room to query or control
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate
    date:
      name: Date
      description: Date to fetch (YYYY-MM-DD). Defaults to today.
      required: false
      example: "2026-10-13"
      selector:
        text:

get_holiday_mode:
  fields:
    device_id:
      name: Tado X Home device
      description: Optional when only one Tado X home is configured; select the Tado X Home device when multiple homes are configured (not a room or thermostat).
      required: false
      selector:
        device:
          integration: tado_x
  name: Get holiday mode
  description: >-
    Read the home's holiday mode settings (enabled, start/end dates and room
    settings). Returns the settings as a response. Requires an Auto-Assist
    (Premium) subscription.

set_holiday_mode:
  name: Set holiday mode
  description: >-
    Enable or disable holiday mode and optionally set its start/end date.
    Requires an Auto-Assist (Premium) subscription. Dates are ISO-8601
    date-time strings.
  fields:
    device_id:
      name: Tado X Home device
      description: Optional when only one Tado X home is configured; select the Tado X Home device when multiple homes are configured (not a room or thermostat).
      required: false
      selector:
        device:
          integration: tado_x
    enabled:
      name: Enabled
      description: Turn holiday mode on (true) or off (false).
      required: true
      example: true
      selector:
        boolean:
    start_date:
      name: Start date
      description: ISO-8601 start date-time (e.g. 2026-12-20T08:00:00Z). Optional.
      required: false
      example: "2026-12-20T08:00:00Z"
      selector:
        text:
    end_date:
      name: End date
      description: ISO-8601 end date-time (e.g. 2027-01-05T20:00:00Z). Optional.
      required: false
      example: "2027-01-05T20:00:00Z"
      selector:
        text:

save_schedule_profile:
  name: Save schedule profile
  description: Save the current Home and Away schedule to a room profile, or to a home-wide template using a name such as Eco default.
  fields:
    entity_id:
      name: Climate entity
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate
    profile:
      name: Profile name
      required: true
      example: Eco
      selector:
        text:

restore_schedule_profile:
  name: Restore schedule profile
  description: Restore a room profile (with home default fallback), or explicitly restore a home-wide template using a name such as Eco default.
  fields:
    entity_id:
      name: Climate entity
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate
    profile:
      name: Profile name
      required: true
      example: Eco
      selector:
        text:

list_schedule_profiles:
  name: List schedule profiles
  description: List configured and unconfigured schedule profiles for a room.
  fields:
    entity_id:
      name: Climate entity
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate

delete_schedule_profile:
  name: Delete schedule profile
  description: Delete a user-defined schedule profile. Default profile names cannot be deleted.
  fields:
    entity_id:
      name: Climate entity
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate
    profile:
      name: Profile name
      required: true
      example: Eco
      selector:
        text:

reset_schedule_default:
  name: Reset home schedule default
  description: Remove a customized home-wide template, reverting to the factory schedule. Does not change any room's active schedule or saved room profiles.
  fields:
    device_id:
      name: Tado X Home device
      description: Optional when only one Tado X home is configured; select the Tado X Home device when multiple homes are configured.
      required: false
      selector:
        device:
          integration: tado_x
    profile:
      name: Default profile name
      description: Normal, Alternative, Eco, or Not in use (optional default suffix).
      required: true
      example: Eco
      selector:
        select:
          options:
            - Normal
            - Alternative
            - Eco
            - Not in use
